<!DOCTYPE html>
<html>
<head>
    <title>Jerseys</title>

    <style>
        .jersey-container{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
        }

        .jersey-card{
            width:220px;
            border:1px solid black;
            padding:15px;
            text-align:center;
        }

        .jersey-card img{
            width:150px;
            height:180px;
        }
    </style>
</head>

<body>

    <h1 align="center"> Jerseys</h1>

    <div class="jersey-container">

        <div class="jersey-card">
            <h3>Argentina</h3>
            <img src="argentina.jpg" alt="Argentina Jersey">
            <p>Price: $90</p>
        </div>

        <div class="jersey-card">
            <h3>Brazil</h3>
            <img src="brazil.jpg" alt="Brazil Jersey">
            <p>Price: $85</p>
        </div>

        <div class="jersey-card">
            <h3>France</h3>
            <img src="france.jpg" alt="France Jersey">
            <p>Price: $92</p>
        </div>

        <div class="jersey-card">
            <h3>England</h3>
            <img src="england.jpg" alt="England Jersey">
            <p>Price: $88</p>
        </div>

        <div class="jersey-card">
            <h3>Germany</h3>
            <img src="germany.jpg" alt="Germany Jersey">
            <p>Price: $89</p>
        </div>

    </div>

</body>
</html>

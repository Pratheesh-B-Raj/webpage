<!DOCTYPE html>
<html>
<head>
    <title>Football Kits</title>

    <style>
        .kit-container{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
        }

        .kit-card{
            width:220px;
            border:1px solid black;
            padding:15px;
            text-align:center;
        }

        .kit-card img{
            width:150px;
            height:150px;
        }
    </style>
</head>

<body>

    <h1 align="center">Football Accessories & Kits</h1>

    <div class="kit-container">

        <div class="kit-card">
            <h3>Football Boots</h3>
            <img src="boots.jpg" alt="Football Boots">
            <p>Price: $120</p>
        </div>

        <div class="kit-card">
            <h3>Shin Guards</h3>
            <img src="shinguard.jpg" alt="Shin Guard">
            <p>Price: $25</p>
        </div>

        <div class="kit-card">
            <h3>Football Socks</h3>
            <img src="socks.jpg" alt="Football Socks">
            <p>Price: $15</p>
        </div>

        <div class="kit-card">
            <h3>Arm Sleeves</h3>
            <img src="sleeves.jpg" alt="Football Sleeves">
            <p>Price: $20</p>
        </div>

        <div class="kit-card">
            <h3>Goalkeeper Gloves</h3>
            <img src="gloves.jpg" alt="Goalkeeper Gloves">
            <p>Price: $40</p>
        </div>

        <div class="kit-card">
            <h3>Football Bag</h3>
            <img src="bag.jpg" alt="Football Bag">
            <p>Price: $35</p>
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Football Shorts</title>

    <style>
        .shorts-container{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
        }

        .short-card{
            width:220px;
            border:1px solid black;
            padding:15px;
            text-align:center;
        }

        .short-card img{
            width:150px;
            height:150px;
        }
    </style>
</head>

<body>

    <h1 align="center">Shorts</h1>

    <div class="shorts-container">

        <div class="short-card">
            <h3>Argentina Shorts</h3>
            <img src="argentina-shorts.jpg" alt="Argentina Shorts">
            <p>Price: $30</p>
            <button>Buy Now</button>
        </div>

        <div class="short-card">
            <h3>Brazil Shorts</h3>
            <img src="brazil-shorts.jpg" alt="Brazil Shorts">
            <p>Price: $28</p>
            <button>Buy Now</button>    
        </div>

        <div class="short-card">
            <h3>France Shorts</h3>
            <img src="france-shorts.jpg" alt="France Shorts">
            <p>Price: $32</p>
            <button>Buy Now</button>    
        </div>

        <div class="short-card">
            <h3>England Shorts</h3>
            <img src="england-shorts.jpg" alt="England Shorts">
            <p>Price: $29</p>
            <button>Buy Now</button>
        </div>

        <div class="short-card">
            <h3>Germany Shorts</h3>
            <img src="germany-shorts.jpg" alt="Germany Shorts">
            <p>Price: $31</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
